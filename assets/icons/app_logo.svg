<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" fill="none">
  <!-- Extended Full-Bleed Background -->
  <rect width="108" height="108" fill="url(#bgGrad)" />

  <!-- Outer Accent Glow Ring (Reduced by 20% to r=37) -->
  <circle cx="54" cy="54" r="37" fill="url(#innerBgGrad)" stroke="url(#borderGrad)" stroke-width="2.2" />
  
  <!-- Subtle Inner Depth Ring (r=31) -->
  <circle cx="54" cy="54" r="31" stroke="#6366F1" stroke-width="1.0" stroke-opacity="0.35" />

  <!-- Rupee Symbol & Inner Circle Path (Reduced by 20% to scale 2.4, Centered) -->
  <g transform="translate(25.2, 25.2) scale(2.4)" stroke="url(#strokeGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 8.25H9m6 3H9m3 6-3-3h1.5a3 3 0 1 0 0-6M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </g>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <radialGradient id="innerBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
</svg>
